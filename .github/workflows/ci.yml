name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      test-db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tracker
          POSTGRES_PASSWORD: tracker
          POSTGRES_DB: tracker_test
        ports:
          - 5430:5432
        options: >-
          --health-cmd "pg_isready -U tracker -d tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright-core install --with-deps chrome
        working-directory: frontend
      - run: npm run typecheck && npm run build && npm test
        working-directory: frontend
      - run: uv run ruff check .
      - run: uv run pytest tests/ -q
      - name: Подготовить отдельную БД браузерной интеграции
        run: >-
          uv run python -c
          "import psycopg;
          c = psycopg.connect('postgresql://tracker:tracker@127.0.0.1:5430/postgres', autocommit=True);
          c.execute('CREATE DATABASE react_e2e'); c.close()"
      - run: uv run alembic upgrade head
        env:
          TRACKER_DATABASE_URL: postgresql+psycopg://tracker:tracker@127.0.0.1:5430/react_e2e
      - run: npm run test:integration
        working-directory: frontend
        env:
          TEST_PYTHON: .venv/bin/python
          TRACKER_DATABASE_URL: postgresql+psycopg://tracker:tracker@127.0.0.1:5430/react_e2e
