<!doctype html>
<html>

      </div>
      <div style="display:flex; flex-direction:column; gap:12px;">
        <div style="background:#16241B; border-radius:14px; padding:16px;">

            <div style="background:#20392A; color:#9BB89C; font-family:'Work Sans', sans-serif; font-size:11px; padding:4px 10px; border-radius:8px;">work</div>

            <div style="background:#20392A; color:#9BB89C; font-family:'Work Sans', sans-serif; font-size:11px; padding:4px 10px; border-radius:8px;">work</div>
            <div style="font-family:'Work Sans', sans-serif; font-size:12px; color:#9BB89C;">на этой неделе</div>

            <div style="background:#20392A; color:#FFB454; font-family:'Work Sans', sans-serif; font-size:11px; padding:4px 10px; border-radius:8px;">личное</div>
            <div style="font-family:'Work Sans', sans-serif; font-size:12px; color:#9BB89C;">сегодня</div>

        <div style="background:#16241B; border-radius:14px; padding:16px;">

          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div style="background:#20392A; color:#9BB89C; font-family:'Work Sans', sans-serif; font-size:11px; padding:4px 10px; border-radius:8px;">work</div>
            <div style="font-family:'Work Sans', sans-serif; font-size:12px; color:#9BB89C;">вт</div>
          </div>
        </div>
      </div>
    </div>

    <div style="background:#20392A; border-radius:18px; padding:20px;">
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:18px;">
        <div style="width:9px; height:9px; border-radius:50%; background:#9BB89C; opacity:0.5;"></div>
        <div style="font-family:'Work Sans', sans-serif; font-size:13px; font-weight:500; color:#9BB89C;">Готово</div>
        <div style="font-family:'Work Sans', sans-serif; font-size:12px; color:#9BB89C; margin-left:auto;">2</div>

        <div style="background:#16241B; border-radius:14px; padding:16px; opacity:0.55;">

            <div style="background:#20392A; color:#FFB454; font-family:'Work Sans', sans-serif; font-size:11px; padding:4px 10px; border-radius:8px;">личное</div>
            <div style="font-family:'Work Sans', sans-serif; font-size:12px; color:#9BB89C;">пт</div>
