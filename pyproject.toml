[project]
name = "pine-ember"
version = "0.1.0"
description = "Add your description here"
requires-python = "==3.14.*"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "sqlalchemy==2.0.54",
    "alembic==1.20.0",
    "pydantic-settings==2.15.0",
    "psycopg[binary]==3.3.6",
    "certifi==2026.7.22",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "ruff==0.16.8",
    "pytest-env==1.7.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "spec(id): acceptance-criteria test tied to a specs/<id>-*.md file — run with -m spec",
]

[tool.pytest_env]
TRACKER_DATABASE_URL = "postgresql+psycopg://tracker:tracker@localhost:5430/tracker_test"

[tool.ruff]
line-length = 120
exclude = ["alembic/versions"]

[tool.ruff.format]
quote-style = "preserve"
