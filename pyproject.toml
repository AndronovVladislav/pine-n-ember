[project]
name = "pine-ember"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic-settings>=2.0.0",
    "psycopg[binary]>=3.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "pytest-env>=1.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "spec(id): acceptance-criteria test tied to a specs/<id>-*.md file — run with -m spec",
]

[tool.pytest_env]
TRACKER_DATABASE_URL = "postgresql+psycopg://tracker:tracker@localhost:5430/tracker_test"

[tool.ruff]
line-length = 120
exclude = ["alembic/versions"]

[tool.ruff.format]
quote-style = "preserve"
