<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pine & Ember</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="toast" class="toast hidden" role="alert"></div>

<header id="app-header">
    <div class="header">
        <div>
            <h1>Pine &amp; Ember</h1>
            <p id="subtitle"></p>
            <nav class="tabs">
                <a class="tab active" id="tab-board" href="#">Доска</a>
                <a class="tab" id="tab-knowledge" href="#/knowledge">База знаний</a>
            </nav>
        </div>
        <div class="header-actions">
            <div class="align-control" id="align-control" role="group" aria-label="Выравнивание">
                <button class="align-btn" data-align="left" title="По левому краю" onclick="setAlign('left')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h10M4 18h13"/></svg>
                </button>
                <button class="align-btn" data-align="center" title="По центру" onclick="setAlign('center')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M5.5 18h13"/></svg>
                </button>
                <button class="align-btn" data-align="right" title="По правому краю" onclick="setAlign('right')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M10 12h10M7 18h13"/></svg>
                </button>
            </div>
        </div>
    </div>
</header>

<section id="board-view">
    <div class="header">
        <div></div>
        <div class="header-actions">
            <button class="add-btn" onclick="openModal()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
                Новая задача
            </button>
        </div>
    </div>

    <div class="board" id="board"></div>
</section>

<section id="knowledge-view" class="hidden">
    <div class="header">
        <div></div>
        <div class="header-actions">
            <button class="btn" onclick="openBlockModal()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
                Новый блок
            </button>
            <button class="add-btn" onclick="openTopicModal()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
                Новая тема
            </button>
        </div>
    </div>

    <div id="knowledge-content"></div>
</section>

<section id="detail-view" class="hidden">
    <button class="back-link" onclick="goToBoard()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 18l-6-6 6-6"/>
        </svg>
        Назад к доске
    </button>
    <div class="detail-card" id="detail-card"></div>
</section>

<div class="overlay" id="overlay">
    <div class="modal">
        <h3>Новая задача</h3>
        <div class="field">
            <label>Название</label>
            <input type="text" id="input-title" placeholder="Например: разобрать WAL">
        </div>
        <div class="field">
            <label>Тег</label>
            <input type="text" id="input-tag" list="tag-options" placeholder="work, личное, или свой">
            <datalist id="tag-options"></datalist>
        </div>
        <div class="field">
            <label>Дата</label>
            <input type="text" id="input-due" placeholder="например: пт, сегодня, ср">
        </div>
        <div class="field">
            <label>Статус</label>
            <input type="text" id="input-status" list="status-options" placeholder="Черновик, В работе, или свой">
            <datalist id="status-options"></datalist>
        </div>
        <div class="modal-actions">
            <button class="btn" onclick="closeModal()">Отмена</button>
            <button class="btn primary" onclick="addTask()">Добавить</button>
        </div>
    </div>
</div>

<div class="overlay" id="topic-overlay">
    <div class="modal">
        <h3 id="topic-modal-title">Новая тема</h3>
        <div class="field">
            <label>Название</label>
            <input type="text" id="input-topic-name" placeholder="Например: API">
        </div>
        <div class="field">
            <label>Описание</label>
            <input type="text" id="input-topic-description" placeholder="Коротко, о чём эта тема">
        </div>
        <div class="field">
            <label>Блок</label>
            <select id="input-topic-block">
                <option value="">без блока</option>
            </select>
        </div>
        <div class="modal-actions">
            <button class="btn" onclick="closeTopicModal()">Отмена</button>
            <button class="btn primary" id="topic-submit-btn" onclick="addTopic()">Добавить</button>
        </div>
    </div>
</div>

<div class="overlay" id="concept-overlay">
    <div class="modal">
        <h3 id="concept-modal-title">Новое понятие</h3>
        <div class="field">
            <label>Название</label>
            <input type="text" id="input-concept-name" placeholder="Например: Definition">
        </div>
        <div class="field">
            <label>Описание</label>
            <input type="text" id="input-concept-description" placeholder="Коротко, что это за понятие">
        </div>
        <div class="modal-actions">
            <button class="btn" onclick="closeConceptModal()">Отмена</button>
            <button class="btn primary" id="concept-submit-btn" onclick="addConcept()">Добавить</button>
        </div>
    </div>
</div>

<div class="overlay" id="block-overlay">
    <div class="modal">
        <h3 id="block-modal-title">Новый блок</h3>
        <div class="field">
            <label>Название</label>
            <input type="text" id="input-block-name" placeholder="Например: Backend">
        </div>
        <div class="modal-actions">
            <button class="btn" onclick="closeBlockModal()">Отмена</button>
            <button class="btn primary" id="block-submit-btn" onclick="addBlock()">Добавить</button>
        </div>
    </div>
</div>

<script src="/app.js"></script>
</body>
</html>
